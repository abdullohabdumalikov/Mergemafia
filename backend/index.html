<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>API Server</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #667eea; }
    code { background: #f3f4f6; padding: 2px 8px; border-radius: 4px; }
    ul { line-height: 2; }
  </style>
</head>
<body>
  <h1>User API Server</h1>
  <p>Server ishlayapti. Mavjud endpointlar:</p>
  <ul>
    <li><code>GET /users</code> — barcha userlar</li>
    <li><code>GET /users/:id</code> — bitta user</li>
    <li><code>POST /users</code> — user yaratish</li>
    <li><code>PUT /users/:id</code> — user yangilash</li>
    <li><code>DELETE /users/:id</code> — user o'chirish</li>
  </ul>
</body>
</html>
